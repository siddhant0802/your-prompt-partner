
name: VoloWeb Live Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: voloweb-live-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy live app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build production application
        run: npm run build:cpanel
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Validate build and prepare restart trigger
        run: |
          test -f .output/app.cjs
          test -f .output/server/index.mjs
          test -f .output/nitro.json
          test -d .output/public
          mkdir -p .output/tmp
          date -u +%FT%TZ > .output/tmp/restart.txt

      - name: Upload live application files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.VOLOWEB_FTP_HOST }}
          port: ${{ secrets.VOLOWEB_FTP_PORT }}
          protocol: ftps
          security: strict
          username: ${{ secrets.VOLOWEB_FTP_USERNAME }}
          password: ${{ secrets.VOLOWEB_FTP_PASSWORD }}
          local-dir: .output/
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
